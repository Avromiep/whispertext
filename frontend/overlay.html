<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WhisperText Overlay</title>
    <style>html, body { background: transparent !important; overflow: hidden; }</style>
    <script>
      // Same trick as index.html: apply the last-known resolved theme
      // synchronously so the overlay doesn't flash the wrong palette before
      // Overlay.tsx fetches settings and confirms it.
      (function () {
        var cached = localStorage.getItem("wt-resolved-theme") || "light";
        document.documentElement.classList.add(cached);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
